<!-- Modal Popup for Experience -->
<div class="modal-overlay" id="expModal">
  <div class="modal-content glass">
    <button class="modal-close" id="modalClose">&times;</button>
    <div class="modal-body">
      <div class="modal-gallery" id="modalGallery">
        <!-- Images will be inserted here dynamically -->
      </div>
      <div class="modal-details">
        <h2 id="modalTitle" class="gradient-text">Title</h2>
        <div id="modalDate" class="exp-date" style="margin-top: 0.5rem; display: inline-block;">Date</div>
        <div id="modalCategories" class="exp-categories" style="margin-bottom: 0.5rem;"></div>
        <h4 id="modalCompany" style="margin-top: 0.5rem;">Company</h4>
        <div class="exp-location" style="margin-top: 10px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span id="modalLocation">Location</span>
        </div>
        <p id="modalDesc" style="margin-top: 20px; line-height: 1.7; color: var(--text-secondary);">Description goes here.</p>
      </div>
    </div>
  </div>
</div>

<!-- Modal Popup for Projects -->
<div class="modal-overlay" id="projectModal">
  <div class="modal-content glass project-modal-content">
    <button class="modal-close" id="projectModalClose">&times;</button>
    <div class="modal-body">
      <div class="project-modal-hero">
        <img id="projectModalImg" src="" alt="Project Preview" loading="lazy">
      </div>
      <div class="modal-details">
        <h2 id="projectModalTitle" class="gradient-text">Project Title</h2>
        <h4 id="projectModalSubtitle" class="project-modal-sub">Sub title</h4>
        <div class="project-modal-tags" id="projectModalTags"></div>
        <p id="projectModalDesc" class="project-modal-desc"></p>
        
        <div class="project-modal-features">
          <h5>Key Highlights:</h5>
          <ul id="projectModalFeaturesList"></ul>
        </div>

        <div class="project-modal-actions">
          <a href="#" id="projectModalLiveLink" target="_blank" rel="noopener noreferrer" class="btn btn-primary-glow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            Live Demo
          </a>
          <a href="#" id="projectModalCodeLink" target="_blank" rel="noopener noreferrer" class="btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            Source Code
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Popup for Certificates -->
<div class="modal-overlay" id="certModal">
  <div class="modal-content glass cert-modal-content">
    <button class="modal-close" id="certModalClose">&times;</button>
    <div class="modal-body cert-modal-body">
      <div class="cert-modal-preview">
        <img id="certModalImg" src="" alt="Certificate Full Preview" loading="lazy">
        <a id="certModalImgDirect" href="" target="_blank" class="cert-open-full-btn" title="Open in Full Tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          Open Original Image
        </a>
      </div>
      <div class="modal-details cert-modal-details">
        <div class="cert-modal-header-badge">
          <span class="cert-modal-id" id="certModalId">ID: ---</span>
        </div>
        <h2 id="certModalTitle" class="gradient-text">Certificate Title</h2>
        <h4 id="certModalIssuer" class="cert-modal-issuer">Issued by Organization</h4>
        <div class="cert-modal-date" id="certModalDate">Issued: ---</div>
        <p id="certModalDesc" style="margin-top: 15px; line-height: 1.7; color: var(--text-secondary);"></p>
        <div class="cert-skills-section">
          <h5>Competencies & Skills:</h5>
          <div class="cert-modal-skills" id="certModalSkills"></div>
        </div>
      </div>
    </div>
  </div>
</div>
